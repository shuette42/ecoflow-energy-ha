// --- EMS Change Report (cmd_func=96, cmd_id=8) ---
// All fields use oneof wrappers to preserve proto3 zero-values.
// Without oneof, proto3 omits fields with value 0 during serialization,
// which causes connectivity status (0=disconnected) and feed_mode
// (0=self_use) to silently disappear from MessageToDict output.
message JTS1EmsChangeReport {
  oneof _sys_work_sta { uint32 sys_work_sta = 1; }
  oneof _sys_grid_sta { uint32 sys_grid_sta = 2; }
  oneof _ems_word_mode { uint32 ems_word_mode = 3; }
  oneof _ems_backup_event { uint32 ems_backup_event = 4; }
  oneof _bp_chg_dsg_sta { uint32 bp_chg_dsg_sta = 5; }
  oneof _ems_keep_soc { uint32 ems_keep_soc = 6; }
  oneof _bp_soc { uint32 bp_soc = 7; }
  oneof _ems_sys_self_check_stat { uint32 ems_sys_self_check_stat = 8; }
  oneof _bp_online_sum { uint32 bp_online_sum = 9; }
  oneof _sys_on_off_machine_stat { uint32 sys_on_off_machine_stat = 10; }
  oneof _sys_bat_chg_up_limit { uint32 sys_bat_chg_up_limit = 11; }
  oneof _sys_bat_dsg_down_limit { uint32 sys_bat_dsg_down_limit = 12; }
  oneof _bp_total_chg_energy { uint32 bp_total_chg_energy = 13; }
  oneof _bp_total_dsg_energy { uint32 bp_total_dsg_energy = 14; }
  oneof _sys_bat_backup_ratio { uint32 sys_bat_backup_ratio = 15; }
  oneof _ems_feed_mode { uint32 ems_feed_mode = 16; }
  oneof _ems_feed_ratio { uint32 ems_feed_ratio = 17; }
  oneof _ems_feed_pwr { uint32 ems_feed_pwr = 18; }
  oneof _sys_meter_cfg { uint32 sys_meter_cfg = 19; }
  oneof _sys_type_cfg { uint32 sys_type_cfg = 20; }
  oneof _pcs_run_sta { uint32 pcs_run_sta = 21; }
  oneof _pcs_ac_err_code { uint32 pcs_ac_err_code = 22; }
  oneof _pcs_dc_err_code { uint32 pcs_dc_err_code = 23; }
  oneof _pcs_ac_warning_code { uint32 pcs_ac_warning_code = 191; }
  oneof _mppt1_fault_code { uint32 mppt1_fault_code = 194; }
  oneof _mppt2_fault_code { uint32 mppt2_fault_code = 195; }
  oneof _ems_ctrl_led_bright { uint32 ems_ctrl_led_bright = 152; }
  oneof _ems_work_state { uint32 ems_work_state = 205; }
  oneof _iot_4g_sta { sint32 iot_4g_sta = 187; }
  oneof _eth_wan_stat { uint32 eth_wan_stat = 224; }
  oneof _wifi_sta_stat { uint32 wifi_sta_stat = 225; }
  oneof _grid_is_energized { bool grid_is_energized = 752; }
  // Fields below appear in cmd_id=17 only. The two command ids carry
  // disjoint field sets on the same message: cmd 8 reports configuration
  // and mode, cmd 17 reports run state, fault flags and the arc-fault
  // detector. A device that sends both fills this message from both.
  oneof _sys_heat_stat { uint32 sys_heat_stat = 190; }
  oneof _mppt1_warning_code { uint32 mppt1_warning_code = 196; }
  oneof _mppt2_warning_code { uint32 mppt2_warning_code = 197; }
  oneof _bp_line_off_flag { uint32 bp_line_off_flag = 198; }
  oneof _bat_relay_close_fail_flag { uint32 bat_relay_close_fail_flag = 201; }
  oneof _afci_fault_flag_ch1 { uint32 afci_fault_flag_ch1 = 211; }
  oneof _afci_fault_flag_ch2 { uint32 afci_fault_flag_ch2 = 216; }
  oneof _afci_sellf_test_result { uint32 afci_sellf_test_result = 220; }
  oneof _sys_cal_stat { uint32 sys_cal_stat = 223; }
  oneof _parallel_type { uint32 parallel_type = 233; }
  // cmd_id=8 only, but absent from the earlier field selection.
  oneof _ems_sg_ready_en { bool ems_sg_ready_en = 183; }
  oneof _ems_sg_run_stat { uint32 ems_sg_run_stat = 184; }
  oneof _battery_limit_reason { uint32 battery_limit_reason = 600; }

  // Grid-protection thresholds and their trip times, as commissioned in the
  // inverter. Read off a live single-phase unit: 253.0 / 287.5 V over-voltage
  // against 207.0 / 103.5 V under-voltage, 50.5 Hz over against 48.0 Hz under,
  // trip times of 500 and 1000 ms. Installer configuration that does not move,
  // so none of it becomes an entity. Declared because a device that sends them
  // otherwise reports forty undecoded field numbers on every download, which
  // buries the numbers that are genuinely unknown.
  oneof _meter_connect_stat { uint32 meter_connect_stat = 30; }
  oneof _pcs_over_vol1 { float pcs_over_vol1 = 31; }
  oneof _pcs_over_vol2 { float pcs_over_vol2 = 32; }
  oneof _pcs_over_vol3 { float pcs_over_vol3 = 33; }
  oneof _pcs_over_vol_time1 { uint32 pcs_over_vol_time1 = 34; }
  oneof _pcs_over_vol_time2 { uint32 pcs_over_vol_time2 = 35; }
  oneof _pcs_over_vol_time3 { uint32 pcs_over_vol_time3 = 36; }
  oneof _pcs_low_vol1 { float pcs_low_vol1 = 37; }
  oneof _pcs_low_vol2 { float pcs_low_vol2 = 38; }
  oneof _pcs_low_vol3 { float pcs_low_vol3 = 39; }
  oneof _pcs_low_vol_time1 { uint32 pcs_low_vol_time1 = 40; }
  oneof _pcs_low_vol_time2 { uint32 pcs_low_vol_time2 = 41; }
  oneof _pcs_low_vol_time3 { uint32 pcs_low_vol_time3 = 42; }
  oneof _pcs_over_vol_recover { float pcs_over_vol_recover = 43; }
  oneof _pcs_low_vol_recover { float pcs_low_vol_recover = 44; }
  oneof _pcs_vol_recover_time { uint32 pcs_vol_recover_time = 45; }
  oneof _pcs_10min_over_vol { float pcs_10min_over_vol = 46; }
  oneof _pcs_10min_over_vol_time { uint32 pcs_10min_over_vol_time = 47; }
  oneof _pcs_over_freq1 { float pcs_over_freq1 = 48; }
  oneof _pcs_over_freq2 { float pcs_over_freq2 = 49; }
  oneof _pcs_over_freq_time1 { uint32 pcs_over_freq_time1 = 50; }
  oneof _pcs_over_freq_time2 { uint32 pcs_over_freq_time2 = 51; }
  oneof _pcs_low_freq1 { float pcs_low_freq1 = 52; }
  oneof _pcs_low_freq2 { float pcs_low_freq2 = 53; }
  oneof _pcs_low_freq_time1 { uint32 pcs_low_freq_time1 = 54; }
  oneof _pcs_low_freq_time2 { uint32 pcs_low_freq_time2 = 55; }
  oneof _pcs_over_freq_recover { float pcs_over_freq_recover = 56; }
  oneof _pcs_low_freq_recover { float pcs_low_freq_recover = 57; }
  oneof _pcs_freq_recover_time { uint32 pcs_freq_recover_time = 58; }
  oneof _pcs_hvrt_lvrt_switch { uint32 pcs_hvrt_lvrt_switch = 59; }
  oneof _pcs_over_vol_ride_through_start1 { float pcs_over_vol_ride_through_start1 = 60; }
  oneof _pcs_over_vol_ride_through_start2 { float pcs_over_vol_ride_through_start2 = 61; }
  oneof _pcs_over_vol_ride_through_protect_time1 { uint32 pcs_over_vol_ride_through_protect_time1 = 62; }
  oneof _pcs_over_vol_ride_through_protect_time2 { uint32 pcs_over_vol_ride_through_protect_time2 = 63; }
  oneof _pcs_low_vol_ride_through_start1 { float pcs_low_vol_ride_through_start1 = 64; }
  oneof _pcs_low_vol_ride_through_start2 { float pcs_low_vol_ride_through_start2 = 65; }
  oneof _pcs_low_vol_ride_through_start3 { float pcs_low_vol_ride_through_start3 = 66; }
  oneof _pcs_low_vol_ride_through_protect_time1 { uint32 pcs_low_vol_ride_through_protect_time1 = 67; }
  oneof _pcs_low_vol_ride_through_protect_time2 { uint32 pcs_low_vol_ride_through_protect_time2 = 68; }
  oneof _pcs_low_vol_ride_through_protect_time3 { uint32 pcs_low_vol_ride_through_protect_time3 = 69; }

  // IEEE 2030.5 is the utility-to-inverter control standard. A unit enrolled
  // in a network operator's scheme reports the state of that control link,
  // and one single-phase inverter sends these two fields five times a second
  // and nothing else on this command. Until they were declared, its most
  // frequent message parsed clean and empty.
  //
  // No entity yet: the entity list is static per device type, so every
  // PowerOcean owner would get a sensor only an enrolled unit can populate.
  // Declaring them first means the next download from any unit shows whether
  // this is one installation or a whole region.
  oneof _ieee20305_connect_stat { uint32 ieee20305_connect_stat = 612; }
  oneof _ieee20305_ctrl_stat { uint32 ieee20305_ctrl_stat = 613; }
  oneof _ieee20305_last_ctrl_timestamp { uint32 ieee20305_last_ctrl_timestamp = 614; }
}

// JTS1EmsParamChangeReport (cmd_id=13). Carries the user-tunable parameter
// state that the EcoFlow app reads on dashboard open. Field 10 is the
// surplus-slider mirror that the app writes via cmd_id=112 wire field 4
// (`dev_soc`); the device echoes it here so other clients can observe
// what the app set, even though the EMS-side `sys_bat_backup_ratio` (in
// JTS1EmsChangeReport) is not updated by the app's truncated SET.
//
// Only `dev_soc` is decoded for now; other fields are documented for
// future use but not parsed.
message JTS1EmsParamChangeReport {
  oneof _dev_soc { uint32 dev_soc = 10; }
}

// --- Delta 3 generation (portable power stations) ---
//
// The Delta 3 generation publishes protobuf only - it never answers the
// JSON `latestQuotas` request that the other device families use. The
// main status frame (cmd_func=254, cmd_id=21) carries the same field
// names as the HTTP quota response, so both transports feed the same
// sensor keys.
//
// Every field is wrapped in its own `oneof` (the proto3 `optional`
// form). This is presence tracking and it is mandatory: without it a
// legitimate 0 (for example AC input power while the grid is
// disconnected) would be indistinguishable from "not sent" and the
// sensor would silently keep the previous value.
//
// This is a deliberate subset of the device's status message - protobuf
// ignores field numbers it does not know, so unlisted fields are simply
// skipped during parsing.

message Delta3PowGetAcOutList {
  repeated float pow_get_ac_out_item = 1;
}

message Delta3PowGet12VList {
  repeated float pow_get_12v_item = 1;
}

// Main status frame (cmd_func=254, cmd_id=21). Sent in full every 120 s
// and incrementally (changed fields only) about every 2 s under load.
message Delta3DisplayProperty {
  // --- Power totals (W) ---
  oneof _pow_in_sum_w { float pow_in_sum_w = 3; }
  oneof _pow_out_sum_w { float pow_out_sum_w = 4; }

  // --- Inputs (W) ---
  oneof _pow_get_ac_in { float pow_get_ac_in = 54; }
  oneof _pow_get_pv { float pow_get_pv = 361; }
  oneof _pow_get_pv2 { float pow_get_pv2 = 70; }

  // --- Outputs (W) ---
  oneof _pow_get_12v { float pow_get_12v = 37; }
  oneof _pow_get_typec1 { float pow_get_typec1 = 11; }
  oneof _pow_get_typec2 { float pow_get_typec2 = 12; }
  oneof _pow_get_typec3 { float pow_get_typec3 = 100; }
  oneof _pow_get_qcusb1 { float pow_get_qcusb1 = 9; }
  oneof _pow_get_qcusb2 { float pow_get_qcusb2 = 10; }

  // Per-outlet arrays: AC item[0] = AC1, item[2] = AC2 (signed, negative
  // while the outlet delivers power). The 12 V list is the Anderson port.
  oneof _pow_get_ac_out_list { Delta3PowGetAcOutList pow_get_ac_out_list = 972; }
  oneof _pow_get_12v_list { Delta3PowGet12VList pow_get_12v_list = 969; }

  // --- Port flow states (4 = inactive, other values = active) ---
  oneof _flow_info_ac_out { uint32 flow_info_ac_out = 367; }
  oneof _flow_info_ac2_out { uint32 flow_info_ac2_out = 971; }
  oneof _flow_info_12v { uint32 flow_info_12v = 33; }

  // --- Battery state ---
  oneof _cms_batt_soc { float cms_batt_soc = 262; }
  oneof _cms_chg_dsg_state { uint32 cms_chg_dsg_state = 282; }
  oneof _cms_dsg_rem_time { uint32 cms_dsg_rem_time = 268; }
  oneof _cms_chg_rem_time { uint32 cms_chg_rem_time = 269; }

  // --- SoC limits / backup reserve (%) ---
  oneof _cms_max_chg_soc { uint32 cms_max_chg_soc = 270; }
  oneof _cms_min_dsg_soc { uint32 cms_min_dsg_soc = 271; }
  oneof _backup_reverse_soc { uint32 backup_reverse_soc = 461; }

  // AC charge power limit in watts, the value behind the app's charge speed
  // slider (#181). Identified by direct manipulation rather than from a
  // single snapshot: a reporter moved the slider from 1000 W to 1200 W and
  // this field followed exactly, while every other field in the frame stayed
  // put. App slider range is 200 W to 2400 W.
  oneof _ac_in_chg_pow_max { uint32 ac_in_chg_pow_max = 209; }

  // AC charge mode: 0 = custom power, 1 = battery-optimised, 2 = silent.
  // The read-back for the charge speed slider above: the slider only takes
  // effect in custom mode, so the two belong together. Observed at 0 on a
  // DELTA 3 Max Plus whose app sat in custom mode with an active slider.
  oneof _ac_in_chg_mode { uint32 ac_in_chg_mode = 124; }

  // LCD backlight timeout in seconds, the app's "LCD screen timeout" under
  // automatic shutdown. Six fixed steps: 10, 30, 60, 300, 1800 and 0, where 0
  // is the app's "Never" and means the screen stays lit - not the reverse.
  // That reading is not an assumption: a screenshot of the app's own settings
  // page was held against a capture taken minutes earlier on the same D3M1,
  // and all five rows of that page matched their fields, three of them
  // reading "Never" against a wire value of 0. There is no field anywhere in
  // this family that switches the panel off outright, and the app offers no
  // such control either.
  oneof _screen_off_time { uint32 screen_off_time = 18; }

  // The four idle shutdowns from the same app page, in minutes. Each one powers
  // its output - or the whole unit - down after the configured span with no load
  // connected and no activity, which is the app's own wording and the reason
  // these are not plain timers.
  //
  // All four offer the same eight steps: 30, 60, 120, 240, 360, 720, 1440 and 0,
  // where 0 is "Never". The unit is settled rather than inferred: a screenshot
  // of the 12 V DC page with "2 h" ticked was held against a capture in which
  // field 20 read 120, and two hours is 120 minutes.
  //
  // Note the unit differs from screen_off_time above, which is seconds, inside
  // this one message.
  oneof _dev_standby_time { uint32 dev_standby_time = 17; }
  oneof _ac_standby_time { uint32 ac_standby_time = 19; }
  oneof _dc_standby_time { uint32 dc_standby_time = 20; }
  oneof _ac2_standby_time { uint32 ac2_standby_time = 1460; }

  // --- Switch / flag state ---
  oneof _energy_backup_en { bool energy_backup_en = 7; }
  oneof _en_beep { bool en_beep = 195; }
  oneof _xboost_en { bool xboost_en = 25; }
  oneof _bypass_out_disable { bool bypass_out_disable = 146; }

  // Port priority. Each output port can be marked non-essential, in which case
  // it stops being powered once the battery falls to its own threshold. The
  // read-back always carries all three ports even when one changed; the write
  // carries exactly one. `port_enable` true means non-essential - the port has
  // a cutoff - and false means essential, which is the proto3 default and so
  // arrives as an absent field.
  oneof _power_outages_list { Delta3PowerOutagesList power_outages_list = 968; }

  // 1 means port priority is currently in effect, any other value means it is
  // not. It engages when there is no AC or grid input and no smart generator
  // or microinverter is connected, so 2 is the everyday value. Confirmed in
  // both directions by cutting mains ahead of a D3M1: it arrives as a change
  // push within a second, not only in the two-minute full upload.
  oneof _power_outages_active_flag { uint32 power_outages_active_flag = 1279; }
}

// Port priority payload, shared by the read-back (field 968) and the write
// (ConfigWrite field 376). Port type: 1 = DC, 2 = AC 1, 3 = AC 2.
message Delta3PowerOutageItem {
  oneof _power_outage_port_enable { bool power_outage_port_enable = 1; }
  oneof _power_outage_port_type { uint32 power_outage_port_type = 2; }
  oneof _power_outage_min_soc { uint32 power_outage_min_soc = 3; }
}

message Delta3PowerOutagesList {
  repeated Delta3PowerOutageItem power_outage_item = 1;
}

// Battery-side heartbeat (cmd_func=32, cmd_id=2), sent every 10 s. Two
// nested version packs; only the v1p0 pack carries values we surface.
message Delta3EmsHeartbeatV1P0 {
  oneof _max_charge_soc { uint32 max_charge_soc = 7; }
  oneof _lcd_show_soc { uint32 lcd_show_soc = 9; }
  oneof _chg_remain_time { uint32 chg_remain_time = 12; }
  oneof _dsg_remain_time { uint32 dsg_remain_time = 13; }
  oneof _f32_lcd_show_soc { float f32_lcd_show_soc = 15; }
  oneof _min_dsg_soc { uint32 min_dsg_soc = 21; }
}

message Delta3EmsHeartbeatV1P3 {
  oneof _sys_chg_dsg_state { uint32 sys_chg_dsg_state = 4; }
}

message Delta3CmsHeartbeat {
  optional Delta3EmsHeartbeatV1P0 v1p0 = 1;
  optional Delta3EmsHeartbeatV1P3 v1p3 = 2;
}

// BMS heartbeat (cmd_func=32, cmd_id=50), sent about every 10 s alongside
// the CMS heartbeat. This is the only frame that carries battery health:
// state of health, cycle count and the lifetime charge/discharge energy
// counters the device keeps itself. None of it exists in the HTTP quota,
// so these keys have no Standard Mode counterpart - see the note in
// `parsers/delta3_proto.py`.
//
// The pack-level arrays (cell_vol, cell_temp, mos_temp) are deliberately
// left out: they are per-cell debug data, they would add sixteen entities
// per device, and the min/max pairs below already carry the health signal.
message Delta3BmsHeartbeat {
  oneof _soc { uint32 soc = 6; }
  oneof _vol { uint32 vol = 7; }
  oneof _amp { int32 amp = 8; }
  oneof _temp { int32 temp = 9; }
  oneof _design_cap { uint32 design_cap = 11; }
  oneof _remain_cap { uint32 remain_cap = 12; }
  oneof _full_cap { uint32 full_cap = 13; }
  oneof _cycles { uint32 cycles = 14; }
  oneof _soh { uint32 soh = 15; }
  oneof _max_cell_vol { uint32 max_cell_vol = 16; }
  oneof _min_cell_vol { uint32 min_cell_vol = 17; }
  oneof _max_cell_temp { int32 max_cell_temp = 18; }
  oneof _min_cell_temp { int32 min_cell_temp = 19; }
  oneof _max_mos_temp { int32 max_mos_temp = 20; }
  oneof _min_mos_temp { int32 min_mos_temp = 21; }
  oneof _max_vol_diff { uint32 max_vol_diff = 31; }
  oneof _cell_series_num { uint32 cell_series_num = 32; }
  oneof _all_err_code { uint32 all_err_code = 48; }
  oneof _accu_chg_cap { uint32 accu_chg_cap = 50; }
  oneof _accu_dsg_cap { uint32 accu_dsg_cap = 51; }
  oneof _real_soh { float real_soh = 52; }
  oneof _calendar_soh { float calendar_soh = 53; }
  oneof _cycle_soh { float cycle_soh = 54; }
  oneof _accu_chg_energy { uint32 accu_chg_energy = 79; }
  oneof _accu_dsg_energy { uint32 accu_dsg_energy = 80; }
}
